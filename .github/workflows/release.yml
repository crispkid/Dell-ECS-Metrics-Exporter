name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release commit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Helm
        uses: Azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.18.4
      - name: Install pinned Kubernetes schema validator
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" \
            go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          GOBIN="$RUNNER_TEMP/bin" \
            go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.8
          printf '%s\n' "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - name: Verify release tag and policy
        run: |
          ./scripts/release-policy-check.sh
          ./scripts/release-build.sh "$GITHUB_REF_NAME"
      - name: Run deterministic and race gates
        run: |
          ./HARNESS/harness.sh selftest
          ./HARNESS/harness.sh verify
          bash -lc 'source scripts/go-env.sh; go test -race -count=1 -timeout=3m ./...'
          ./scripts/deployment-release-check.sh
          ./scripts/performance-check.sh
      - name: Scan source dependencies
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          path: .
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: table
          grype-version: v0.112.0
      - name: Enforce dependency license allowlist
        run: >-
          osv-scanner
          --licenses="Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC"
          .

  ecs-certification:
    name: Certify exact production ECS build
    needs: validate
    runs-on:
      - self-hosted
      - linux
      - ecs-certification
    timeout-minutes: 45
    environment: ecs-certification
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run protected read-only certification
        run: ./scripts/live-certification.sh
        env:
          ECS_CERT_CONFIG: ${{ secrets.ECS_CERT_CONFIG_PATH }}
          ECS_CERT_INVENTORY_TOKEN_FILE: ${{ secrets.ECS_CERT_INVENTORY_TOKEN_PATH }}
          ECS_CERT_EXPECTED_VERSION: "3.8.1.4"
          ECS_CERT_BASE_URL: ${{ vars.ECS_CERT_BASE_URL }}
      - name: Upload redacted evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: production-ecs-certification-evidence
          path: test-results/certification/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false

  ecs-ce-compatibility:
    name: Validate exact ECS CE test build
    needs: validate
    runs-on:
      - self-hosted
      - linux
      - ecs-ce-compatibility
    timeout-minutes: 45
    environment: ecs-ce-compatibility
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run protected CE Management compatibility gate
        run: ./scripts/live-certification.sh
        env:
          ECS_CERT_CONFIG: ${{ secrets.ECS_CE_CONFIG_PATH }}
          ECS_CERT_INVENTORY_TOKEN_FILE: ${{ secrets.ECS_CE_INVENTORY_TOKEN_PATH }}
          ECS_CERT_EXPECTED_VERSION: "3.8.0.3"
          ECS_CERT_BASE_URL: ${{ vars.ECS_CE_BASE_URL }}
          ECS_CERT_ALLOW_DEGRADED: "true"
      - name: Upload redacted CE evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: test-ecs-ce-compatibility-evidence
          path: test-results/certification/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false

  deployed-e2e:
    name: Certify deployed release candidate
    needs: validate
    runs-on:
      - self-hosted
      - linux
      - ecs-e2e
    timeout-minutes: 30
    environment: ecs-e2e
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run deployed end-to-end gate
        run: ./scripts/e2e-check.sh
        env:
          ECS_E2E_BASE_URL: ${{ vars.ECS_E2E_BASE_URL }}
          ECS_E2E_INVENTORY_TOKEN_FILE: ${{ secrets.ECS_E2E_INVENTORY_TOKEN_PATH }}
          ECS_E2E_CA_FILE: ${{ secrets.ECS_E2E_CA_PATH }}
          ECS_E2E_EXPECTED_ECS_VERSION: "3.8.1.4"
          ECS_E2E_EXPECTED_COMMIT: ${{ github.sha }}
      - name: Upload redacted E2E evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: deployed-e2e-evidence
          path: test-results/e2e/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false

  deployed-performance:
    name: Certify deployed target scale
    needs: validate
    runs-on:
      - self-hosted
      - linux
      - ecs-performance
    timeout-minutes: 30
    environment: ecs-performance
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run deployed performance gate
        run: ./scripts/deployed-performance-check.sh
        env:
          ECS_PERF_BASE_URL: ${{ vars.ECS_PERF_BASE_URL }}
          ECS_PERF_INVENTORY_TOKEN_FILE: ${{ secrets.ECS_PERF_INVENTORY_TOKEN_PATH }}
          ECS_PERF_CA_FILE: ${{ secrets.ECS_PERF_CA_PATH }}
          ECS_PERF_PID_FILE: ${{ vars.ECS_PERF_PID_FILE }}
          ECS_PERF_EXPECTED_COMMIT: ${{ github.sha }}
      - name: Upload redacted performance evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: deployed-performance-evidence
          path: test-results/performance/deployed.json
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false

  publish:
    name: Publish signed release
    needs:
      - validate
      - ecs-certification
      - ecs-ce-compatibility
      - deployed-e2e
      - deployed-performance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Helm
        uses: Azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.18.4
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare immutable release metadata
        id: release
        run: |
          tag="$GITHUB_REF_NAME"
          ./scripts/release-build.sh "$tag"
          version="${tag#v}"
          repository="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/$repository"
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          build_date="$(date -u -d "@$epoch" '+%Y-%m-%dT%H:%M:%SZ')"
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
          printf 'image=%s\n' "$image" >>"$GITHUB_OUTPUT"
          printf 'build_date=%s\n' "$build_date" >>"$GITHUB_OUTPUT"
      - name: Build amd64 scan image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: local/dell-ecs-metrics-exporter:release-scan-amd64
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.release.outputs.build_date }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
      - name: Scan amd64 release image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: local/dell-ecs-metrics-exporter:release-scan-amd64
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: table
          grype-version: v0.112.0
      - name: Build arm64 scan image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/arm64
          tags: local/dell-ecs-metrics-exporter:release-scan-arm64
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.release.outputs.build_date }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
      - name: Scan arm64 release image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: local/dell-ecs-metrics-exporter:release-scan-arm64
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: table
          grype-version: v0.112.0
      - name: Build and push multi-architecture image
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:${{ github.sha }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.release.outputs.build_date }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
      - name: Resolve immutable platform digests
        id: platforms
        run: |
          docker buildx imagetools inspect "$RELEASE_IMAGE@$RELEASE_DIGEST" \
            --raw >"$RUNNER_TEMP/image-index.json"
          amd64="$(
            jq -r '
              .manifests[] |
              select(.platform.os == "linux" and .platform.architecture == "amd64") |
              .digest
            ' "$RUNNER_TEMP/image-index.json"
          )"
          arm64="$(
            jq -r '
              .manifests[] |
              select(.platform.os == "linux" and .platform.architecture == "arm64") |
              .digest
            ' "$RUNNER_TEMP/image-index.json"
          )"
          for digest in "$amd64" "$arm64"; do
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              printf 'invalid platform digest: %s\n' "$digest" >&2
              exit 1
            fi
          done
          printf 'amd64=%s\n' "$amd64" >>"$GITHUB_OUTPUT"
          printf 'arm64=%s\n' "$arm64" >>"$GITHUB_OUTPUT"
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_DIGEST: ${{ steps.push.outputs.digest }}
      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/release/source.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.44.0
      - name: Generate amd64 image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.release.outputs.image }}@${{ steps.platforms.outputs.amd64 }}
          format: spdx-json
          output-file: dist/release/image-linux-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.44.0
      - name: Generate arm64 image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.release.outputs.image }}@${{ steps.platforms.outputs.arm64 }}
          format: spdx-json
          output-file: dist/release/image-linux-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.44.0
      - name: Finalize checksums and image digest
        run: |
          printf '%s@%s\n' "$RELEASE_IMAGE" "$RELEASE_DIGEST" >dist/release/image-digest.txt
          ./scripts/generate-checksums.sh dist/release
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_DIGEST: ${{ steps.push.outputs.digest }}
      - name: Sign image
        run: cosign sign --yes "$RELEASE_IMAGE@$RELEASE_DIGEST"
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
          RELEASE_DIGEST: ${{ steps.push.outputs.digest }}
      - name: Attest image provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest amd64 image SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.platforms.outputs.amd64 }}
          sbom-path: dist/release/image-linux-amd64.spdx.json
          push-to-registry: true
      - name: Attest arm64 image SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.platforms.outputs.arm64 }}
          sbom-path: dist/release/image-linux-arm64.spdx.json
          push-to-registry: true
      - name: Attest release files
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            dist/release/*.tar.gz
            dist/release/*.tgz
            dist/release/SHA256SUMS
      - name: Attest release SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            dist/release/*.tar.gz
          sbom-path: dist/release/source.spdx.json
      - name: Sign checksum manifest
        run: >-
          cosign sign-blob --yes
          --bundle dist/release/SHA256SUMS.bundle
          dist/release/SHA256SUMS
      - name: Publish Helm chart
        id: helm-push
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf '%s' "$GITHUB_TOKEN" |
            helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          output="$(
            helm push \
              dist/release/dell-ecs-metrics-exporter-*.tgz \
              "oci://ghcr.io/$owner/charts"
          )"
          printf '%s\n' "$output"
          digest="$(printf '%s\n' "$output" | awk '$1 == "Digest:" { print $2 }' | tail -n 1)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'invalid Helm OCI digest: %s\n' "$digest" >&2
            exit 1
          fi
          # actions/attest requires an untagged fully qualified subject name;
          # the immutable digest identifies the exact chart manifest.
          printf 'reference=ghcr.io/%s/charts/dell-ecs-metrics-exporter\n' \
            "$owner" >>"$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign Helm OCI chart
        run: cosign sign --yes "$HELM_REFERENCE@$HELM_DIGEST"
        env:
          HELM_REFERENCE: ${{ steps.helm-push.outputs.reference }}
          HELM_DIGEST: ${{ steps.helm-push.outputs.digest }}
      - name: Attest Helm OCI chart
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.helm-push.outputs.reference }}
          subject-digest: ${{ steps.helm-push.outputs.digest }}
          push-to-registry: true
      - name: Publish GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "Dell ECS Metrics Exporter $GITHUB_REF_NAME" \
            dist/release/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
