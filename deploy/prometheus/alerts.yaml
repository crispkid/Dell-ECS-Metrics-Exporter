groups:
  - name: dell-ecs-metrics-exporter
    rules:
      - alert: DellECSExporterDown
        expr: up{job="dell-ecs-metrics-exporter"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Dell ECS Metrics Exporter is unavailable
          description: Prometheus has been unable to scrape {{ $labels.instance }} for 5 minutes.
          runbook: docs/PRODUCTION_RUNBOOK.md#exporter-down

      - alert: DellECSExporterCacheStale
        expr: ecs_exporter_cache_age_seconds > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Dell ECS exporter cache is stale
          description: Cluster {{ $labels.cluster }} collector {{ $labels.collector }} cache age exceeds 15 minutes.
          runbook: docs/PRODUCTION_RUNBOOK.md#cache-stale-or-too-old

      - alert: DellECSExporterCacheTooOld
        expr: ecs_exporter_cache_age_seconds > 3600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Dell ECS exporter cache is too old
          description: Cluster {{ $labels.cluster }} collector {{ $labels.collector }} cache age exceeds one hour.
          runbook: docs/PRODUCTION_RUNBOOK.md#cache-stale-or-too-old

      - alert: DellECSExporterCollectorErrors
        expr: increase(ecs_exporter_collector_errors_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Dell ECS collector is failing
          description: Cluster {{ $labels.cluster }} collector {{ $labels.collector }} recorded errors.
          runbook: docs/PRODUCTION_RUNBOOK.md#collector-or-api-errors

      - alert: DellECSExporterAPIErrors
        expr: increase(ecs_exporter_api_errors_total[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Dell ECS API requests are failing
          description: Cluster {{ $labels.cluster }} API {{ $labels.api }} recorded more than three errors in 15 minutes.
          runbook: docs/PRODUCTION_RUNBOOK.md#collector-or-api-errors

      - alert: DellECSClusterUnhealthy
        expr: ecs_cluster_health < 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Dell ECS cluster health is not normal
          description: Cluster {{ $labels.cluster }} VDC {{ $labels.vdc }} reports an unhealthy state.
          runbook: docs/PRODUCTION_RUNBOOK.md#ecs-health-or-capacity-alert

      - alert: DellECSBucketHardQuotaHigh
        expr: 100 * ecs_bucket_used_bytes / ecs_bucket_hard_quota_bytes >= 90
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Dell ECS bucket hard quota is at least 90 percent used
          description: Bucket {{ $labels.namespace }}/{{ $labels.bucket }} on {{ $labels.cluster }} is nearing its configured hard quota.
          runbook: docs/PRODUCTION_RUNBOOK.md#ecs-health-or-capacity-alert
