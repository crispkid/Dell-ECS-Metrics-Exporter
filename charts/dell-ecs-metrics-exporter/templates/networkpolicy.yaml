{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dell-ecs-metrics-exporter.fullname" . }}
  labels:
    {{- include "dell-ecs-metrics-exporter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dell-ecs-metrics-exporter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress }}
    - Egress
    {{- end }}
  ingress:
    - {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ports:
        - port: {{ .Values.service.containerPort }}
          protocol: TCP
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
