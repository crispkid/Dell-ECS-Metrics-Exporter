apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dell-ecs-metrics-exporter.fullname" . }}
  labels:
    {{- include "dell-ecs-metrics-exporter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dell-ecs-metrics-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dell-ecs-metrics-exporter.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or (not .Values.config.existingConfigMap) .Values.podAnnotations }}
      annotations:
        {{- if not .Values.config.existingConfigMap }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dell-ecs-metrics-exporter.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: exporter
          image: {{ include "dell-ecs-metrics-exporter.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - {{ printf "-config=/etc/ecs-exporter/%s" .Values.config.key | quote }}
            - {{ printf "-profiles-dir=%s" .Values.config.profilesDir | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: exporter-config
              mountPath: /etc/ecs-exporter
              readOnly: true
          {{- if .Values.credentials.existingSecret }}
            - name: ecs-credentials
              mountPath: {{ .Values.credentials.mountPath }}
              readOnly: true
          {{- end }}
          {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: exporter-config
          configMap:
            name: {{ default (include "dell-ecs-metrics-exporter.fullname" .) .Values.config.existingConfigMap }}
            items:
              - key: {{ .Values.config.key }}
                path: {{ .Values.config.key }}
      {{- if .Values.credentials.existingSecret }}
        - name: ecs-credentials
          secret:
            secretName: {{ .Values.credentials.existingSecret }}
            defaultMode: 0440
            items:
              - key: {{ .Values.credentials.inventoryTokenKey }}
                path: inventory-token
              - key: {{ .Values.credentials.usernameKey }}
                path: username
              - key: {{ .Values.credentials.passwordKey }}
                path: password
      {{- end }}
      {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
