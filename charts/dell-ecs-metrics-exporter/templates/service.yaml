apiVersion: v1
kind: Service
metadata:
  name: {{ include "dell-ecs-metrics-exporter.fullname" . }}
  labels:
    {{- include "dell-ecs-metrics-exporter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "dell-ecs-metrics-exporter.selectorLabels" . | nindent 4 }}
